name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Manual rebuild, e.g. to pick up CMS content without pushing a commit.
  workflow_dispatch:

  # A post was published in the CMS.
  #
  # The site is static HTML: blog content is read from Sanity during
  # `pnpm run build`, so a freshly published post only appears online after a
  # new build. The webhook configured in the Studio (see docs/blog.md) calls
  # GitHub's repository_dispatch API with this event_type and does exactly that.
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: read
  # Needed to install @mfe-orchestrator/design-system from GitHub Packages.
  packages: read
  pages: write
  id-token: write

# Allow one concurrent deployment. Every run rebuilds the whole site from the
# CMS, so the newest run always wins: an older one still in flight has nothing
# to add, and letting two deploys race can put the earlier content online last.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache-dependency-path: './pnpm-lock.yaml'
          cache: 'pnpm'

      - name: Authenticate to GitHub Packages
        run: pnpm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: pnpm install
      
      - name: Build
        run: pnpm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_GOOGLE_SEARCH_CONSOLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SEARCH_CONSOLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
